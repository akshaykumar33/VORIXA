<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch zoom stays enabled: disabling it is an accessibility failure. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="VORIXA City: HEAT. Take a city back from the Choir, one job, one outpost at a time." />
  <title>VORIXA City: HEAT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Never pure black: the page shows through for a moment while the city loads. */
      background: #07080b;
      color: #e9edf2;
      font-family: 'Space Grotesk Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    canvas#render-canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- The city draws here; its HUD (src/ui/CityHUD.ts) mounts itself inside #viewport. -->
  <div id="viewport">
    <canvas id="render-canvas"></canvas>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
