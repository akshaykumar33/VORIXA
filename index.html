<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VORIXA — Next-Gen Procedural Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06070a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      color: #f0f4f8;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas#render-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .telemetry-card {
      background: rgba(10, 14, 22, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      padding: 12px 18px;
      font-family: ui-monospace, "JetBrains Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .telemetry-card .accent {
      color: #00f0ff;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-webgpu {
      background: rgba(0, 240, 255, 0.2);
      color: #00f0ff;
      border: 1px solid #00f0ff;
    }
    .badge-webgl {
      background: rgba(255, 183, 3, 0.2);
      color: #ffb703;
      border: 1px solid #ffb703;
    }
    .reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #00f0ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #00f0ff;
    }
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .controls-card {
      background: rgba(10, 14, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #94a3b8;
    }
    .controls-card kbd {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
    }
    #audio-prompt {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #00f0ff;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
    }
    #audio-prompt:hover {
      background: rgba(0, 240, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="viewport-container">
    <canvas id="render-canvas"></canvas>
    <div id="hud-overlay">
      <div class="hud-header">
        <div class="telemetry-card" id="telemetry-left">
          <div>VORIXA <span class="accent">v0.1.0-alpha</span></div>
          <div>FPS: <span id="metric-fps" class="accent">--</span> | P95: <span id="metric-p95" class="accent">-- ms</span></div>
          <div>Sim Ticks: <span id="metric-ticks" class="accent">0</span> | Entities: <span id="metric-entities" class="accent">0</span></div>
        </div>
        <div class="telemetry-card" id="telemetry-right">
          <div>Graphics: <span id="metric-backend" class="badge badge-webgpu">PROBING</span></div>
          <div>Tier: <span id="metric-tier" class="accent">PROBING</span></div>
          <div>Resolution: <span id="metric-res" class="accent">--</span></div>
        </div>
      </div>
      <div class="reticle"></div>
      <div class="hud-footer">
        <div class="controls-card">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &bull; <kbd>Space</kbd> Jump &bull; <kbd>Shift</kbd> Dash &bull; Mouse Look
        </div>
        <div class="telemetry-card">
          Pos: <span id="metric-pos" class="accent">X: 0.0 Y: 0.0 Z: 0.0</span>
        </div>
      </div>
    </div>
    <div id="audio-prompt">Click viewport to engage spatial audio</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
